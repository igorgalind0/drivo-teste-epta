services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drivo}
      POSTGRES_DB: ${POSTGRES_DB:-drivo}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-drivo} -d ${POSTGRES_DB:-drivo}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-drivo}:${POSTGRES_PASSWORD:-drivo}@db:5432/${POSTGRES_DB:-drivo}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CORS_ORIGIN: http://localhost:3000
      PORT: 3333
    ports:
      - '3333:3333'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3333/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
